name: CI

# Roda em todo push, em qualquer branch.
# Garante que o codigo esta correto antes de chegar na main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 - Valida os arquivos Terraform
  # Checa a formatacao sem precisar de credenciais Azure
  # ---------------------------------------------------------------------------
  validar-terraform:
    name: Validar Terraform (fmt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Verificar formatacao (terraform fmt)
        working-directory: ./infra
        run: |
          terraform fmt -check -recursive
          echo "Formatacao dos arquivos .tf esta correta"

  # ---------------------------------------------------------------------------
  # Job 2 - Valida os arquivos do frontend
  # Confirma que os arquivos essenciais existem antes de qualquer deploy
  # ---------------------------------------------------------------------------
  validar-frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          echo "Verificando arquivos do frontend..."
          ERRO=0

          for ARQUIVO in src/index.html src/style.css src/app.js; do
            if [ -f "$ARQUIVO" ]; then
              echo "OK: $ARQUIVO encontrado"
            else
              echo "ERRO: $ARQUIVO NAO encontrado"
              ERRO=1
            fi
          done

          if [ $ERRO -ne 0 ]; then
            echo ""
            echo "Deploy cancelado: um ou mais arquivos obrigatorios estao ausentes."
            exit 1
          fi

          echo ""
          echo "Todos os arquivos do frontend estao presentes."
