name: CI

# Roda em todo push, em qualquer branch.
# Valida o codigo e simula o que o Terraform faria — sem criar nada.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION:     "1.7.5"
  TF_WORKING_DIR: "./infra"
  # Nome da storage account onde o state do Terraform fica guardado
  TF_STATE_SA:    "stnemesisgs26"
  TF_STATE_RG:    "rg-nemesis-tfstate"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 - Valida e simula o Terraform (plan)
  # Mostra exatamente o que sera criado/alterado antes de chegar na main
  # ---------------------------------------------------------------------------
  validar-terraform:
    name: Terraform (fmt + validate + plan)
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ env.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=nemesis.terraform.tfstate"

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"

  # ---------------------------------------------------------------------------
  # Job 2 - Valida os arquivos do frontend
  # ---------------------------------------------------------------------------
  validar-frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          ERRO=0
          for ARQUIVO in src/index.html src/style.css src/app.js; do
            if [ -f "$ARQUIVO" ]; then
              echo "OK: $ARQUIVO encontrado"
            else
              echo "ERRO: $ARQUIVO NAO encontrado"
              ERRO=1
            fi
          done
          if [ $ERRO -ne 0 ]; then
            echo "Deploy cancelado: arquivos obrigatorios ausentes."
            exit 1
          fi
          echo "Todos os arquivos do frontend estao presentes."
