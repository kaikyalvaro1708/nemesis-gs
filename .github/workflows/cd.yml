name: CD

# Roda apenas quando o codigo chega na main.
# Sobe a infraestrutura no Azure e publica o site automaticamente.
on:
  push:
    branches: [main]

env:
  TF_VERSION:        "1.6.6"
  TF_WORKING_DIR:    "./infra"
  AZURE_WEBAPP_NAME: "nemesis-app"
  APP_URL:           "https://nemesis-app.azurewebsites.net"
  # Storage account onde o state do Terraform e guardado entre execucoes
  TF_STATE_SA:       "stnemesisgs26"
  TF_STATE_RG:       "rg-nemesis-tfstate"

jobs:
  # ---------------------------------------------------------------------------
  # Job 0 - Verificacao de secrets
  # Para o pipeline cedo com mensagem clara se algum secret estiver ausente
  # ---------------------------------------------------------------------------
  verificar-secrets:
    name: Verificar Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checar secrets obrigatorios
        env:
          CHECK_ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          CHECK_ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          CHECK_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          CHECK_ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          CHECK_ALERT_EMAIL:         ${{ secrets.ALERT_EMAIL }}
        run: |
          ERRO=0
          for VAR in CHECK_ARM_CLIENT_ID CHECK_ARM_CLIENT_SECRET CHECK_ARM_SUBSCRIPTION_ID CHECK_ARM_TENANT_ID CHECK_ALERT_EMAIL; do
            if [ -z "${!VAR}" ]; then
              echo "AUSENTE: $VAR nao esta definido nos Secrets do repositorio"
              ERRO=1
            else
              echo "OK: $VAR definido"
            fi
          done
          if [ $ERRO -ne 0 ]; then
            echo ""
            echo "Adicione os secrets ausentes em: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Todos os secrets obrigatorios estao presentes."

  # ---------------------------------------------------------------------------
  # Job 1 - Infraestrutura
  # Cria o storage do state (se nao existir) e aplica o Terraform
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Infraestrutura (Terraform)
    runs-on: ubuntu-latest
    needs: verificar-secrets

    concurrency:
      group: terraform
      cancel-in-progress: false

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Azure CLI
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Criar storage para o Terraform state (idempotente)
        run: |
          az group create \
            --name ${{ env.TF_STATE_RG }} \
            --location brazilsouth \
            --output none || true

          az storage account create \
            --name ${{ env.TF_STATE_SA }} \
            --resource-group ${{ env.TF_STATE_RG }} \
            --location brazilsouth \
            --sku Standard_LRS \
            --allow-blob-public-access false \
            --output none || true

          az storage container create \
            --name tfstate \
            --account-name ${{ env.TF_STATE_SA }} \
            --output none || true

          echo "Storage de state pronto: ${{ env.TF_STATE_SA }}/tfstate"

      - name: Instalar Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ env.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=nemesis.terraform.tfstate"

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=================================="
          echo "  Infraestrutura provisionada     "
          echo "=================================="
          terraform output app_service_url
          terraform output resource_group_name
          echo "=================================="

  # ---------------------------------------------------------------------------
  # Job 2 - Aplicacao
  # Publica a pasta src/ no Azure App Service apos a infra estar no ar.
  # Se o App Service nao existir (ex.: infra foi destruida em main.tf), o
  # job termina com sucesso sem tentar publicar em um recurso inexistente.
  # ---------------------------------------------------------------------------
  deploy-app:
    name: Aplicacao (Azure App Service)
    runs-on: ubuntu-latest
    needs: deploy-infra

    concurrency:
      group: app-deploy
      cancel-in-progress: false

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Azure CLI
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Verificar se o App Service existe
        id: check-app
        run: |
          if az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group rg-nemesis > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "App Service ${{ env.AZURE_WEBAPP_NAME }} encontrado — prosseguindo com o deploy."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "App Service ${{ env.AZURE_WEBAPP_NAME }} nao encontrado — infra foi destruida (ou ainda nao provisionada). Nada para publicar, pulando deploy."
          fi

      - name: Deploy da pasta src/ no App Service
        if: steps.check-app.outputs.exists == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "./src"

      - name: Deploy concluido
        if: steps.check-app.outputs.exists == 'true'
        run: |
          echo "=========================================="
          echo "   NEMESIS - Publicado com sucesso!       "
          echo "=========================================="
          echo "  Acesse em: ${{ env.APP_URL }}"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Por:       ${{ github.actor }}"
          echo "=========================================="
